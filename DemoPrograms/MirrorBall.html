<!DOCTYPE html>
<html>

<title>MirrorBall WASM Demo</title>
<style>

    overflow: hidden;
    background: black;
  }

  /* Chrome, Edge, Safari */
  ::-webkit-scrollbar {
    display: none;
  }

  /* Firefox */
  body {
    scrollbar-width: none;
  }
</style>
</head>
<body style="margin:0;background:black">
<canvas id="c" width="300" height="150" style="width:100%"></canvas>

<script>

let ctx = c.getContext("2d");

.then(o=>{
  let e = o.instance.exports;

  function loop(){
    e.u();
    ctx.putImageData(
      new ImageData(
        new Uint8ClampedArray(e.m.buffer,0,180000),
        300,150
      ),
      0,0
    );
    requestAnimationFrame(loop);
  }

  loop();
});
</script>

</body>
</html>
