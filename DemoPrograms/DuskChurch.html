<!DOCTYPE html>
<html>
<head>
    <title>Dusk Church - Found Footage</title>
    <style>
        body { margin: 0; background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { box-shadow: 0 0 50px #000; image-rendering: pixelated; }
    </style>
</head>
<body>
    <canvas id="a"></canvas>
    <script>
        const c = a.getContext('2d');
        
        // Set fixed size for the canvas
        const w = a.width = 640;
        const h = a.height = 480;

        // Dusk gradient background with blur
        a.style.background = "linear-gradient(0,#522E19 0%,#002845 21%,#001F21 73%)";
        a.style.filter = "blur(2px)";

        // Shortcuts
        const R = Math.random;
        c.F = c.fill;
        c.R = c.rect;
        const F = "fillStyle";
        const D = () => +new Date();

        // Polygon drawing helper (scaled by 5 for byte-saving coordinates)
        const S = (arr) => {
            c.beginPath();
            let x = arr[0], y = arr[1];
            c.moveTo(x * 5, y * 5);
            for (let i = 2; i < arr.length; i += 2) {
                c.lineTo(arr[i] * 5, arr[i + 1] * 5);
            }
            c.closePath();
            c.F();
        };

        // Static Noise Texture Generation
        const N = document.createElement("canvas");
        N.width = w * 2;
        N.height = h * 2;
        const C = N.getContext("2d");
        const I = C.createImageData(w * 2, h * 2);
        const buffer = new Uint32Array(I.data.buffer);
        let len = buffer.length;
        while (len--) {
            // Hex 0x80C0FFC0 = Semi-transparent light green/gray noise
            buffer[len] = R() < 0.60 ? 0 : 0x80C0FFC0;
        }
        C.putImageData(I, 0, 0);

        const startTime = D();
        c.scale(2, 2);

        const draw = () => {
            // Clear and apply cam shake
            c.clearRect(0, 0, w, h);
            const shake = R() * 2 - 1;
            c.translate(shake, shake);

            // 1. Draw the distant church/fence line
            c[F] = "#001210";
            S([41, 48, 51, 44, 55, 46, 60, 44, 64, 46, 64, 48]);

            // 2. Draw the main church silhouette
            c[F] = "black";
            S([0, 28, 30, 28, 30, 22, 39, 7, 48, 22, 48, 48, 0, 48]);
            
            // 3. The Cross
            c.R(192.5, 15, 5, 25); // Vertical
            c.R(187.5, 20, 15, 5); // Horizontal
            c.F();

            // 4. Timed Lighting Event (The "Ghostly" light)
            if (D() - startTime > 4000) {
                c[F] = "#252b02"; // Dim yellow/green light
                // Small attic windows
                S([35.5, 23, 38.5, 23, 38.5, 18]);
                S([39.5, 23, 42.5, 23, 39.5, 18]);
                // Main windows
                c.R(197.5, 120, 15, 40);
                c.R(177.5, 120, 15, 40);
                c.F();
            }

            // 5. Apply Film Grain
            c.drawImage(N, -(w * R()), -(h * R()));

            // Reset translation for next frame
            c.setTransform(2, 0, 0, 2, 0, 0);
            requestAnimationFrame(draw);
        };

        draw();
    </script>
</body>
</html>
