<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden; background:#000">
    <canvas id="a"></canvas>
    <script>
        const c = a.getContext('2d');
        let p=[], F=400, V=650, W=220, N=100, B=0, t=0, S=16, T=30, Q=1500, f=.2;

        // Colors: [R, G, B]
        const X=[
            [W,W,N], // Greenish
            [N,W,W], // Teal
            [W,W,W], // White (Snow)
            [W,S,S]  // Reddish (Object)
        ];

        const dr=(q,p,m,l,t,A)=>{
            for(let g=2;g--;)
                for(let j=0,k=p;j<(t?l:g?l:1);k++){
                    let K=(q[k].y>=Q?40:0)*Math.sin(j+++t*.06);
                    let z = q[k].z -t*f+K;
                    if(g) {
                        q[k].X=F*(q[k].x)/z + a.width/2;
                        q[k].Y=F*(q[k].y+K)/z + (t?a.height/2:N);
                    } else {
                        window.Z|=z <= N;
                        let C=X[q[k].c];
                        let e=q[k+m].y-q[k].y;
                        let d=q[k+m].z-q[k].z;
                        let h=q[k+1].x-q[k].x;
                        let u=[e-d*(q[k+1].y-q[k].y), d*h, -e*h];
                        let mag=Math.sqrt(u[0]*u[0]+u[1]*u[1]+u[2]*u[2]);
                        u=u.map(e=>e/mag);
                        u=.4+.6*(u[0]*f+(t?u[1]:u[1]*f+u[2]));
                        c.fillStyle='rgba(' + C[0]*u + ',' + C[1]*u + ',' + C[2]*u + ','+A+')';
                        c.beginPath();
                        c.lineTo(q[k].X,    q[k].Y);
                        c.lineTo(q[k+1].X,  q[k+1].Y);
                        c.lineTo(q[k+m+1].X,q[k+m+1].Y);
                        c.lineTo(q[k+m].X,  q[k+m].Y);
                        c.fill();
                    }
                }
        };

        const loop = () => {
            a.width = window.innerWidth;
            a.height = window.innerHeight;
            c.fillStyle='#28a';
            c.fillRect(0,0,a.width,a.height);

            for(;(A=p.length)<N*N;B++) {
                for(let j=0;j++<N;){
                    let k=j-N/2;
                    let h=N/Math.abs(k);
                    p.push({x: k*N + W*Math.sin(B*f), y:(Math.random()/2+.3*(h>10?10:h))*1050-Q, z: F+B * N, c:0});
                }
                for(window.Z=3;--Z;)
                    for(let j=0;B>1&&j<N;) {
                        let k=A-N+j++;
                        p[k].y=(p[k].y + p[k-1].y + (p[k-N]?p[k-N].y:p[k].y))/3;
                        p[k].c=p[k].y<W?2:p[k].y<Q?0:1;
                    }
            }

            let i = A/N-2;
            for(;i>0;i--) dr(p,i*N,N,N-1,t++,1-i*N/A);
            if(window.Z) p=p.slice(N);

            for(let i=0;++i<=S;){
                for(let n=S;n--;){
                    let x=2+n%2;
                    let g=Math.cos(n*f), h=Math.cos(n*f+f), e=Math.sin(n*f), d=Math.sin(n*f+f);
                    let s=W*Math.sin(i*f), b=W*Math.sin(i*f+f);
                    dr([{x:s*g, y:i*T, z:s*e+V, c:x},
                        {x:s*h, y:i*T, z:s*d+V, c:x},
                        {x:b*g, y:i*T+T, z:b*e+V, c:x},
                        {x:b*h, y:i*T+T, z:b*d+V, c:x}],0,2,4,0,1);
                }
            }
            requestAnimationFrame(loop);
        };
        loop();
    </script>
</body>
</html>
