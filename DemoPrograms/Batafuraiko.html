<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Batafuraiko</title>
<style>
    html,body{margin:0;background:#000;overflow:hidden}
    canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// canvas
let a = document.getElementById('c');
let c = a.getContext('2d');

// constants
const WIDTH = 1280;
const HEIGHT = 720;

const TYPE_Explosion        = -1;
const TYPE_Bullet           = 0;
const TYPE_Player           = 1;
const TYPE_Enemy            = 3;
const TYPE_Enemy_Pawn       = 3;
const TYPE_Enemy_Scout      = 4;
const TYPE_Enemy_Fighter    = 5;
const TYPE_Enemy_Battleship = 6;
const TYPE_Enemy_Mothership = 7;
const TYPE_Enemy_Cthulhu    = 8;

// variables
let i, frame, seed, globalSeed, player, spawnPool, spawnWait, wave, enemyCount, spawnCount, objects;

// RNG
let Rand = (max=1)=> Math.sin(++seed)**2 * 1e5 % 1 * max;

// object creator
let MakeObject = (t,x,y,r,v,w,e,h=1)=>objects.push({t,x,y,r,v,w,e,h,s:h});

// init
objects = [];
MakeObject(TYPE_Player, 0, -72, 15, 0, 0, 0);
player = objects[frame = globalSeed = wave = spawnCount = enemyCount = 0];

// input
onmousemove = e=>{
    player.x = Math.min(WIDTH, e.clientX);
    player.y = Math.min(HEIGHT, e.clientY);
};

// loop
setInterval(()=>{

    frame += enemyCount ? 1 : wave;

    // shoot
    frame%9 || player.r && enemyCount &&
        MakeObject(TYPE_Bullet, player.x, player.y, 19,
            Math.sin(frame*frame)/3, -9, 0);

    // spawn pool
    seed = wave*wave;
    spawnPool = [];
    for(i=wave;i--;spawnPool.push(Rand(Math.min(6,wave))|0)){}

    // spawn enemies
    seed = wave*spawnCount;
    spawnCount ?
        --spawnWait ||
        MakeObject(
            i = wave < 10 ? TYPE_Enemy + spawnPool[Rand(wave)|0] : TYPE_Player,
            Rand(WIDTH,--spawnCount), -72,
            5*i+4,
            Rand(2)-1,
            Rand()+(i<TYPE_Enemy_Scout?3:i>TYPE_Enemy_Scout&i<TYPE_Enemy_Mothership?2:1),
            wave < 10,
            1+(i-TYPE_Enemy)**2,
            spawnWait = wave<10?(i-TYPE_Enemy+2)**2*5:9
        )
    :
    enemyCount || (spawnCount=++wave+19,spawnWait=200);

    // clear
    c.fillStyle='#000';
    c.fillRect(enemyCount=0,0,a.width=WIDTH,a.height=HEIGHT);

    // stars
    for(i=seed=400;i--;c.fillStyle='#fff')
        c.fillRect(Rand(WIDTH),Rand(frame)%HEIGHT,Rand(),Rand(5));

    // objects
    objects.map(o=>{
        o.x+=o.v;
        o.y+=o.w;
        seed = ++globalSeed;

        if(o.t>TYPE_Player){
            ++enemyCount;

            o.t>TYPE_Enemy_Pawn &
            Rand(99)<1 &&
            MakeObject(
                o.t<TYPE_Enemy_Mothership?TYPE_Bullet:o.t-5,
                o.x,o.y,o.r/3,
                o.t>TYPE_Enemy_Scout?2*Math.sin(frame):0,
                o.t&1?2*Math.sin(frame+11):3,
                31
            );

            o.t&1|| (o.v+=Math.sin(frame/30)/30);

            if(o.y>HEIGHT+100 & o.e<2){
                o.y=-72;
                o.x=Rand(WIDTH);
                o.h=o.s;
            }
        }

        for(i=o.t>TYPE_Bullet?16:1;i--;
            c.beginPath(c.fill(
                o.t>0 ?
                c.ellipse(
                    o.x+o.r*(Rand(2)-1)*(i%2*2-1),
                    o.y+o.r*(Rand(2)-1),
                    Rand(o.r),Rand(o.r/3),
                    (Rand(9)+Math.sin((frame+o.x+o.y)/30)/3)*(i%2*2-1),
                    0,9
                )
                :
                c.ellipse(o.x,o.y,o.e?o.r:5,o.r,0,0,9)
            ))
        ){
            seed=(i/2+9|0)*o.t*9;
            c.fillStyle=`hsl(${o.e*(160+o.t*89+o.r)+61+Rand(99)+99*o.h/o.s} 128%${50+(i>>1)*9}%`;
        }

        o.t<TYPE_Bullet?--o.r:
        o.e||objects.map(p=>
            o.t!=p.t &
            Math.hypot(o.x-p.x,o.y-p.y)<p.r*2 &
            p.e &&
            MakeObject(TYPE_Explosion,o.x,o.y,25,0,o.r=0,4,--p.h ||
            MakeObject(TYPE_Explosion,p.x,p.y,p.r*2,0,p.r=0,2))
        );
    });

    // title
    for(i=9;i--;){
        a.style.cursor='none';
        c.font='8em sans-serif';
        c.textAlign='center';
        c.lineWidth=6;
        c.strokeStyle=`hsl(${frame+i*29} 100% 50%)`;
        c.fillStyle='#000';
        let x=WIDTH/2+Math.sin(frame/30+i*Math.PI+i)*i*2;
        let y=200+Math.cos(frame/30+i*Math.PI+i*i)*i*2;
        c.fillText('バタフライ',x,y);
        c.strokeText('バタフライ',x,y);
    }

    // cleanup
    objects = objects.filter(o=>o.r>0 & Math.hypot(o.x-WIDTH/2,o.y-HEIGHT)<WIDTH);

},8);
</script>
</body>
</html>
