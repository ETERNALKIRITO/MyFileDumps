<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Whip</title>
<link rel="icon" type="image/png" href="https://ik.imagekit.io/9llyyueko/STATIC%20IMAGES/icon512.png?updatedAt=1745897130894" />
<style>
  * { margin: 0; padding: 0; cursor: crosshair; }
  /* We use a subtle background color for the web version so it's not totally transparent */
  html, body { overflow: hidden; background: #1a1a1a; width: 100%; height: 100%; }
  canvas { display: block; }
  
  /* Instruction text for the web */
  #hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.3);
    font-family: sans-serif;
    font-size: 24px;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Click to spawn whip. Click again to drop.</div>
<canvas id="c"></canvas>
<script>
// ══════════════════════════════════════════════════════════════════════════════
//  PHYSICS SETTINGS 
// ══════════════════════════════════════════════════════════════════════════════
const P = {
  segments: 28, segmentLength: 25, taper: 0.6,
  gravity: 1.2, dropGravity: 0.95, damping: 0.96, constraintIters: 20, maxStretchRatio: 1.2,
  baseTargetAngle: -1.12, handleAimByMouseX: 0.4, handleAimByMouseY: 0.2, handleAimClamp: 2.0,
  handleSpring: 0.7, handleAngularDamping: 0.078, basePoseSegments: 2, basePoseStiffStart: 0.9, basePoseStiffEnd: 0.8,
  handleMaxBendDeg: 16, tipMaxBendDeg: 130, bendRigidityStart: 0.8, bendRigidityEnd: 0.12,
  wallBounce: 0.42, wallFriction: 0.86,
  crackSpeed: 340, crackCooldownMs: 200, firstCrackGraceMs: 100,
  lineWidthHandle: 7, lineWidthTip: 5, outlineWidth: 3, handleExtraWidth: 5, handleThickSegments: 2,
  arcWidth: 260, arcHeight: 185,
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouseX = W/2, mouseY = H/2;
let prevMouseX = mouseX, prevMouseY = mouseY;
let whip = null;
let dropping = false;
let lastCrackTime = 0;
let whipSpawnTime = 0;
let handleAngle = P.baseTargetAngle;
let handleAngVel = 0;
let flashAlpha = 0; // Visual flash for web version

// Replace with your actual sound URLs if you have them hosted
const WHIP_CRACK_SOUNDS = [
  'https://ik.imagekit.io/9llyyueko/AUDIO/Whip1.mp3',
  'https://ik.imagekit.io/9llyyueko/AUDIO/Whip2.mp3',
  'https://ik.imagekit.io/9llyyueko/AUDIO/Whip3.mp3',
  'https://ik.imagekit.io/9llyyueko/AUDIO/Whip4.mp3',
  'https://ik.imagekit.io/9llyyueko/AUDIO/Whip5.mp3'
];

document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// WEB TOGGLE: Click to spawn, click again to drop
document.addEventListener('mousedown', (e) => {
  if (!whip || dropping) {
    hint.style.display = 'none'; // hide hint
    mouseX = e.clientX;
    mouseY = e.clientY;
    whip = spawnWhip(mouseX, mouseY);
    dropping = false;
    prevMouseX = mouseX;
    prevMouseY = mouseY;
    handleAngle = P.baseTargetAngle;
    handleAngVel = 0;
  } else {
    dropping = true;
  }
});

function spawnWhip(mx, my) {
  whipSpawnTime = Date.now();
  lastCrackTime = 0;
  const pts = [];
  for (let i = 0; i < P.segments; i++) {
    const t = i / (P.segments - 1);
    const x = mx + t * P.arcWidth;
    const y = my - Math.sin(t * Math.PI * 0.75) * P.arcHeight;
    pts.push({ x, y, px: x, py: y });
  }
  return pts;
}

function segLen(i) {
  const t = i / (P.segments - 1);
  return P.segmentLength * (1 - t * (1 - P.taper));
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

function catmullPoint(pts, i) {
  const n = pts.length;
  if (n === 0) return { x: 0, y: 0 };
  if (i < 0) return n >= 2 ? { x: 2 * pts[0].x - pts[1].x, y: 2 * pts[0].y - pts[1].y } : { x: pts[0].x, y: pts[0].y };
  if (i >= n) return n >= 2 ? { x: 2 * pts[n - 1].x - pts[n - 2].x, y: 2 * pts[n - 1].y - pts[n - 2].y } : { x: pts[n - 1].x, y: pts[n - 1].y };
  return pts[i];
}

function whipSegmentBezier(pts, i) {
  const p0 = catmullPoint(pts, i - 1), p1 = pts[i], p2 = pts[i + 1], p3 = catmullPoint(pts, i + 2);
  return {
    cp1x: p1.x + (p2.x - p0.x) / 6, cp1y: p1.y + (p2.y - p0.y) / 6,
    cp2x: p2.x - (p3.x - p1.x) / 6, cp2y: p2.y - (p3.y - p1.y) / 6,
    x2: p2.x, y2: p2.y,
  };
}
const wrapPi = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };

function playCrackSound() {
  if (!WHIP_CRACK_SOUNDS.length) return;
  const src = WHIP_CRACK_SOUNDS[Math.floor(Math.random() * WHIP_CRACK_SOUNDS.length)];
  const a = new Audio(src);
  a.play().catch(() => {});
  
  // Trigger Web visual flash
  flashAlpha = 0.5; 
}

function updateHandleAim() {
  if (dropping) return;
  const delta = clamp((mouseX - prevMouseX) * P.handleAimByMouseX + (mouseY - prevMouseY) * P.handleAimByMouseY, -P.handleAimClamp, P.handleAimClamp);
  const target = P.baseTargetAngle + delta;
  handleAngVel += wrapPi(target - handleAngle) * P.handleSpring;
  handleAngVel *= P.handleAngularDamping;
  handleAngle = wrapPi(handleAngle + handleAngVel);
}

function applyBasePose() {
  if (!whip || dropping) return;
  const dx = Math.cos(handleAngle), dy = Math.sin(handleAngle);
  const guided = Math.min(P.basePoseSegments, whip.length - 1);
  for (let i = 1; i <= guided; i++) {
    const stiff = lerp(P.basePoseStiffStart, P.basePoseStiffEnd, (i - 1) / Math.max(guided - 1, 1));
    const tx = whip[i - 1].x + dx * segLen(i - 1), ty = whip[i - 1].y + dy * segLen(i - 1);
    whip[i].x = lerp(whip[i].x, tx, stiff);
    whip[i].y = lerp(whip[i].y, ty, stiff);
  }
}

function applyBendLimits() {
  if (!whip || whip.length < 3) return;
  for (let i = 1; i < whip.length - 1; i++) {
    const a = whip[i - 1], b = whip[i], c = whip[i + 1];
    const v1x = a.x - b.x, v1y = a.y - b.y, v2x = c.x - b.x, v2y = c.y - b.y;
    const l1 = Math.hypot(v1x, v1y) || 0.0001, l2 = Math.hypot(v2x, v2y) || 0.0001;
    const dot = clamp((v1x / l1) * (v2x / l2) + (v1y / l1) * (v2y / l2), -1, 1);
    const t = i / (whip.length - 2);
    const maxBend = lerp(P.handleMaxBendDeg, P.tipMaxBendDeg, t) * Math.PI / 180;
    if (Math.PI - Math.acos(dot) <= maxBend) continue;

    const sign = (v1x/l1 * v2y/l2 - v1y/l1 * v2x/l2) >= 0 ? 1 : -1;
    const targetA = Math.atan2(v1y/l1, v1x/l1) + sign * (Math.PI - maxBend);
    const rigidity = lerp(P.bendRigidityStart, P.bendRigidityEnd, t);
    c.x = lerp(c.x, b.x + Math.cos(targetA) * l2, rigidity);
    c.y = lerp(c.y, b.y + Math.sin(targetA) * l2, rigidity);
  }
}

function capSegmentStretch() {
  if (!whip || whip.length < 2) return;
  for (let i = 0; i < whip.length - 1; i++) {
    const dx = whip[i + 1].x - whip[i].x, dy = whip[i + 1].y - whip[i].y;
    const dist = Math.hypot(dx, dy) || 0.0001, maxLen = segLen(i) * P.maxStretchRatio;
    if (dist > maxLen) {
      whip[i + 1].x = whip[i].x + dx * (maxLen / dist);
      whip[i + 1].y = whip[i].y + dy * (maxLen / dist);
    }
  }
}

function applyWallCollisions() {
  if (!whip || dropping) return;
  for (let i = 1; i < whip.length; i++) {
    const p = whip[i];
    let vx = p.x - p.px, vy = p.y - p.py, hit = false;
    if (p.x < 0) { p.x = 0; if (vx < 0) vx = -vx * P.wallBounce; vy *= P.wallFriction; hit = true; }
    else if (p.x > W) { p.x = W; if (vx > 0) vx = -vx * P.wallBounce; vy *= P.wallFriction; hit = true; }
    if (p.y < 0) { p.y = 0; if (vy < 0) vy = -vy * P.wallBounce; vx *= P.wallFriction; hit = true; }
    else if (p.y > H) { p.y = H; if (vy > 0) vy = -vy * P.wallBounce; vx *= P.wallFriction; hit = true; }
    if (hit) { p.px = p.x - vx; p.py = p.y - vy; }
  }
}

function update() {
  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - 0.05);
  
  if (!whip) return;
  const g = dropping ? P.dropGravity : P.gravity;
  updateHandleAim();

  for (let i = dropping ? 0 : 1; i < whip.length; i++) {
    const p = whip[i], vx = (p.x - p.px) * P.damping, vy = (p.y - p.py) * P.damping;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + g;
  }

  if (!dropping) { whip[0].x = whip[0].px = mouseX; whip[0].y = whip[0].py = mouseY; }

  capSegmentStretch(); applyWallCollisions(); applyBasePose();

  for (let iter = 0; iter < P.constraintIters; iter++) {
    for (let i = 0; i < whip.length - 1; i++) {
      const a = whip[i], b = whip[i + 1], dx = b.x - a.x, dy = b.y - a.y;
      const diff = ((Math.sqrt(dx * dx + dy * dy) || 0.0001) - segLen(i)) / (Math.sqrt(dx * dx + dy * dy) || 0.0001) * 0.5;
      if (i === 0 && !dropping) { b.x -= dx * diff * 2; b.y -= dy * diff * 2; }
      else { a.x += dx * diff; a.y += dy * diff; b.x -= dx * diff; b.y -= dy * diff; }
    }
    applyBendLimits(); if (!dropping) applyBasePose();
    capSegmentStretch(); applyWallCollisions();
  }

  const tip = whip[whip.length - 1];
  if (!dropping && Math.hypot(tip.x - tip.px, tip.y - tip.py) > P.crackSpeed) {
    const now = Date.now();
    if (now - whipSpawnTime >= P.firstCrackGraceMs && now - lastCrackTime > P.crackCooldownMs) {
      lastCrackTime = now;
      playCrackSound();
    }
  }

  if (dropping && whip.every(p => p.y > H + 60)) { whip = null; dropping = false; }
  prevMouseX = mouseX; prevMouseY = mouseY;
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw flash effect when cracked
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (!whip) return;

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff';
  if (whip.length >= 2) {
    ctx.beginPath(); ctx.moveTo(whip[0].x, whip[0].y);
    for (let i = 0; i < whip.length - 1; i++) {
      const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
    }
    ctx.lineWidth = P.lineWidthTip + P.outlineWidth * 2; ctx.stroke();

    const thickLinks = Math.min(P.handleThickSegments, whip.length - 1);
    if (thickLinks > 0 && P.handleExtraWidth > 0) {
      ctx.beginPath(); ctx.moveTo(whip[0].x, whip[0].y);
      for (let i = 0; i < thickLinks; i++) {
        const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
        ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2);
      }
      ctx.lineWidth = P.lineWidthHandle + P.handleExtraWidth + P.outlineWidth * 2; ctx.stroke();
    }
  }

  ctx.strokeStyle = '#111';
  for (let i = 0; i < whip.length - 1; i++) {
    ctx.lineWidth = lerp(P.lineWidthHandle, P.lineWidthTip, i / Math.max(1, whip.length - 2)) + (i < P.handleThickSegments ? P.handleExtraWidth : 0);
    const { cp1x, cp1y, cp2x, cp2y, x2, y2 } = whipSegmentBezier(whip, i);
    ctx.beginPath(); ctx.moveTo(whip[i].x, whip[i].y);
    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x2, y2); ctx.stroke();
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
