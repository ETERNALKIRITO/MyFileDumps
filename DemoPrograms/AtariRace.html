<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pole Position Demake</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
        #u {
            position: absolute; top: 10px; left: 10px;
            color: #fff; font-family: monospace; pointer-events: none;
            background: rgba(0,0,0,0.5); padding: 5px;
        }
    </style>
</head>
<body>
    <div id="u">WASD / Arrows to Drive</div>
    <canvas id="v"></canvas>

<script>
/* -------------------------------------------------------------
ATARI 2600 POLE POSOTION DEMAKE
---------------------------------------------------------------- */
const canvas = document.getElementById('v');
const c = canvas.getContext('2d');

let S=Math.sin,
    C=Math.cos,
    w, h, a, b, t=0, s=0, M=0, O=8, o, k={},
    l=v=>b/v;

const p=(e, state)=>{
    let q=e.keyCode;
    if(q==38||q==90||q==87) k.u=state; // Up / Z / W
    if(q==40||q==83) k.d=state;        // Down / S
    if(q==39||q==68) k.r=state;        // Right / D
    if(q==37||q==65||q==81) k.l=state; // Left / A / Q
};

window.onkeydown=e=>p(e, 1);
window.onkeyup=e=>p(e, 0);

window.onresize=_=>{
    canvas.width=w=window.innerWidth;
    canvas.height=h=window.innerHeight;
    a=200; // segments
    b=h/2/a; // segment height
};
window.onresize();

const R=_=>{
    // Sky
    c.fillStyle='#57b';
    c.fillRect(0,0,w,h/2);
    
    t+=s;
    // Acceleration logic
    if(k.u && s<.08) s+=0.0001; 
    else s = (s>0 ? s-0.0005 : 0);
    if(k.d) s-=0.002;
    if(s<0) s=0;

    o=500*s;
    if(o>8) o=8;
    if(k.l) M+=o;
    if(k.r) M-=o;
    
    // Friction/Centrifugal force
    O-=M/(100/(s+0.01));

    // Road Base
    c.fillStyle='#666';
    c.fillRect(0,h/2,w,h/2);

    // Mountains
    const G=offset=>{
        c.beginPath();
        let P=~~(w/30);
        c.moveTo(0, h/2);
        for(let i=0; i<P*3; i++) {
            c.lineTo(i*(w/P) + (M%w) - w + offset, i>1 ? h/3+S(i*i)*50 : h/2);
        }
        c.lineTo(w*2, h/2);
        c.fill();
    };
    
    c.fillStyle='#161'; G(15);
    c.fillStyle='#a62'; G(0);

    // Road Rendering
    let f='fillRect';
    for(let i=0; i<a; i++){
        let A_pos = O*i - M;
        let F = t + 200/b/i;
        let X = (S(F+C(F)) + C(F/2) + S(F/3)*9) * (b*i) / (1+i/99);
        
        // Shoulders
        c.fillStyle = S(F*9)>0 ? '#b33' : '#fff';
        c[f](w/2 + X - i*l(.5) - A_pos, h/2 + i*b, i*l(8), b+1);
        c[f](w/2 + X + i*l(.5) - A_pos, h/2 + i*b, i*l(8), b+1);
        
        // Lines
        c.fillStyle = S(F*15)>.5 ? '#ca6' : 'rgba(0,0,0,0)';
        c[f](w/2 + X - A_pos, h/2 + i*b, i*l(20), b+1);
    }

    // Car Sprite
    let T = k.l ? -15 : k.r ? 15 : 0;
    let carX = w/2 - 50;
    let carY = h - 80;

    c.fillStyle='#b44'; // Body
    c[f](carX+25+T, carY-3, 50, 20);
    c[f](carX, carY, 100, 30);
    
    c.fillStyle='#000'; // Tires
    c[f](carX, carY, 39, 40);
    c[f](carX+100, carY, -39, 40);
    c[f](carX+25+T, carY-23, 39, 20);
    c[f](carX+75+T, carY-23, -39, 20);
    
    c.fillStyle='#ca6'; // Axle/Detail
    c[f](carX-14, carY-3, 128, 3);

    requestAnimationFrame(R);
};

R();
</script>
</body>
</html>
