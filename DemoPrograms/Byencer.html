<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Byncer</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { border: 1px solid #333; cursor: crosshair; }
        #ui { position: absolute; color: #fff; font-family: monospace; pointer-events: none; text-align: center; }
    </style>
</head>
<body>
    <div id="ui">CLICK TO START</div>
    <canvas id="a"></canvas>

<script>
let canvas = document.getElementById('a'),
    c = canvas.getContext('2d'),
    floor = Math.floor,
    STEPS = 32,
    BPM = 240,
    STEP_TIME = (60 * 1000) / BPM,
    notes = [],
    sx = 0,
    started = false,
    context;

// Setup Canvas size
canvas.width = 640;
canvas.height = 720;
let CELL_SIZE = canvas.width / STEPS;

// Generate notes frequencies
for (let oct = -1; oct < 2; oct++) {
    let base = 440 * Math.pow(2, oct);
    for (let note = -9; note < 3; note++) {
        notes.push(note != 0 ? base * Math.pow(2, note / 12) : base);
    }
}

// Grid initialization
let grid = Array.from({ length: notes.length * STEPS }).map((_, idx) =>
    [204, 224, 422, 532, 540, 746, 764, 852].includes(idx)
);

let getMonochromeColor = v => `rgb(${v},${v},${v})`;

// Audio variables (initialized on click)
let masterVolume, delay, feedback, delayAmountGain;
const ATTACK_TIME = 0.08, SUSTAIN_LEVEL = 0.03, RELEASE_TIME = 0.03, NOTE_LENGTH = 0.14;

function initAudio() {
    context = new (window.AudioContext || window.webkitAudioContext)();
    masterVolume = context.createGain();
    delay = context.createDelay();
    feedback = context.createGain();
    delayAmountGain = context.createGain();

    masterVolume.connect(context.destination);
    masterVolume.gain.value = 0.5;
    delayAmountGain.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(masterVolume);
    delay.delayTime.value = 0.33;
    delayAmountGain.gain.value = 0.3;
    feedback.gain.value = 0.6;
    
    started = true;
    document.getElementById('ui').style.display = 'none';
}

let playNote = (frequency, num = 10) => {
    if (!started) return;
    let osc = context.createOscillator(),
        noteGain = context.createGain();
    
    let g = noteGain.gain;
    g.setValueAtTime(0, context.currentTime);
    g.linearRampToValueAtTime(SUSTAIN_LEVEL, context.currentTime + ATTACK_TIME);
    g.setValueAtTime(SUSTAIN_LEVEL, context.currentTime + NOTE_LENGTH - RELEASE_TIME);
    g.linearRampToValueAtTime(0, context.currentTime + NOTE_LENGTH);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(frequency, context.currentTime);
    osc.start();
    osc.stop(context.currentTime + NOTE_LENGTH);
    
    osc.connect(noteGain);
    noteGain.connect(masterVolume);
    noteGain.connect(delay);
    
    if (num > 0) setTimeout(() => playNote(frequency, num - 1), 25);
};

canvas.addEventListener('mousedown', event => {
    if (!started) initAudio();
    let rect = canvas.getBoundingClientRect(),
        x = floor((event.clientX - rect.left) / CELL_SIZE),
        y = floor((event.clientY - rect.top) / CELL_SIZE),
        idx = y * STEPS + x;
    if (idx >= 0 && idx < grid.length) grid[idx] = !grid[idx];
});

setInterval(() => {
    c.fillStyle = '#000';
    c.fillRect(0, 0, canvas.width, canvas.height);
    
    grid.forEach(function(note, cellIdx) {
        let xStep = cellIdx % STEPS,
            yStep = floor(cellIdx / STEPS),
            x = xStep * CELL_SIZE,
            y = yStep * CELL_SIZE,
            currentStep = xStep == sx,
            evenBar = floor(xStep / 4) % 2;

        c.fillStyle = getMonochromeColor(
            note && currentStep ? 255 :
            note ? 180 :
            currentStep ? 100 :
            [2, 4, 7, 9, 11].includes((notes.length - yStep) % 12) ? 
                (evenBar ? 10 : 25) : (evenBar ? 30 : 45)
        );
        
        c.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
        
        if (currentStep && note && started) {
            playNote(notes[notes.length - 1 - yStep]);
        }
    });
    sx = (sx + 1) % STEPS;
}, STEP_TIME);
</script>
</body>
</html>
