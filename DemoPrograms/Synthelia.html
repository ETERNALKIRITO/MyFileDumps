<!DOCTYPE html>
<html>
<head>
    <title>Synthwave City Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
        canvas { display: block; }
        #debug { position: absolute; top: 5px; left: 5px; color: #FFF; pointer-events: none; }
    </style>
</head>
<body>
    <div id="debug"></div>
    <canvas id="a"></canvas>

    <script>
        const b = document.body;
        const c = a.getContext('2d');
        const debug = document.getElementById("debug");
        
        let frame = 0; 
        let t0 = new Date();
        let innerWidth, innerHeight;

        // --- Data Generation ---
        var buildings = [], mountains = [];
        for (let i = 0; i < 160; ++i) {
            let oneBuilding = [], oneMountain = [3];
            let height = 4 + Math.floor(30 * Math.pow(Math.random(), 3));
            for (let g = 0; g < height; ++g) {
                // Generate window patterns
                oneBuilding.push([Math.random() > .5 ? 1 : 0, Math.random() > .5 ? 1 : 0, Math.random() > .5 ? 1 : 0, Math.random() > .5 ? 1 : 0, Math.random() > .5 ? 1 : 0]);
            }
            buildings.push(oneBuilding);
            for (let g = 0; g < 9; ++g) {
                oneMountain.push(Math.random() * 3 + oneMountain[g]);
            }
            mountains.push(oneMountain);
        }

        function project(x, y, z) {
            x -= 140 + frame / 10;
            y -= 20;
            var angle = -.3047; // cos(angle) ≈ 0.954, sin(angle) ≈ -0.3
            var dx = x * Math.cos(angle) - z * Math.sin(angle);
            var dz = x * Math.sin(angle) + z * Math.cos(angle) + 30;
            var u = innerWidth / 2 + innerWidth * dx / dz;
            var v = innerHeight / 2 - innerWidth * y / dz;
            return [u, v];
        }

        function drawView() {
            innerWidth = window.innerWidth;
            innerHeight = window.innerHeight;
            a.width = innerWidth;
            a.height = innerHeight;

            // Background / Sky
            c.fillStyle = "#005";
            c.fillRect(0, 0, innerWidth, innerHeight);

            // Draw starfield
            c.fillStyle = "#fff";
            for (let i = 1; i < 7500; i++) {
                c.fillRect(i * i % 7525 - 1500, i % 2525 - 1500, 1, i % 15 / 7);
            }

            // Draw Mountains
            for (let j = 8; j > -1; --j) {
                c.fillStyle = "rgb(0,0," + (9 * j) + ")";
                c.beginPath();
                c.moveTo(...project(frame / 80, 0, 80));
                let xPos;
                for (let i = 0; i < 50; ++i) {
                    xPos = Math.floor(i - 30 + frame / 200);
                    let n = mountains[xPos & 31];
                    c.lineTo(...project(xPos * 20, n[j], 150 + j * 20));
                }
                c.lineTo(...project(xPos * 20, 0, 80));
                c.closePath();
                c.fill();
            }

            // Draw Buildings
            for (let j = 0; j < 5; ++j) {
                for (let i = 0; i < 23; ++i) {
                    let x = Math.floor(i + frame / 80);
                    let z = 8 * (15 - j);
                    let n = buildings[(x & 31) + j * 32];

                    // Draw Walls (Left, Right, Front) and Windows
                    c.fillStyle = "#000";
                    // Simplification: Drawing the main mass
                    c.beginPath();
                    c.moveTo(...project(x * 8, 0, z));
                    c.lineTo(...project(x * 8, n.length, z));
                    c.lineTo(...project(x * 8 + 5, n.length, z));
                    c.lineTo(...project(x * 8 + 5, 0, z));
                    c.closePath();
                    c.fill();

                    // Windows
                    c.fillStyle = "#fea";
                    for (let h = 0; h < n.length; ++h) {
                        for (let g = 0; g < 5; ++g) {
                            if (n[h][g]) {
                                c.beginPath();
                                c.moveTo(...project(x * 8 + .2 + g, .1 + h, z));
                                c.lineTo(...project(x * 8 + .2 + g, .9 + h, z));
                                c.lineTo(...project(x * 8 + .8 + g, .9 + h, z));
                                c.lineTo(...project(x * 8 + .8 + g, .1 + h, z));
                                c.closePath();
                                c.fill();
                            }
                        }
                    }
                }
            }

            // Water Reflection Logic
            let riverY = project(-96 + 140 + frame / 10, 0, 80)[1];
            
            c.save();
            c.scale(1, -1);
            for (let i = 0; i * 20 < innerWidth; ++i) {
                let v = innerHeight - riverY - i;
                // Draw slice of canvas flipped for reflection
                try {
                    c.drawImage(a, i * 20, riverY + i - v, 20, v, i * 20, -(v + riverY + i), 20, v);
                } catch(e) {}
            }
            c.restore();

            // Water overlay
            c.fillStyle = "#00408080";
            c.beginPath();
            c.moveTo(0, riverY);
            c.lineTo(innerWidth, riverY + innerWidth / 20);
            c.lineTo(innerWidth, innerHeight);
            c.lineTo(0, innerHeight);
            c.closePath();
            c.fill();
        }

        setInterval(function () {
            drawView();
            frame++;
            let frameRate = 1000 * frame / (new Date() - t0);
            debug.innerHTML = "FPS: " + Math.floor(frameRate * 100) / 100;
        }, 40);
    </script>
</body>
</html>
